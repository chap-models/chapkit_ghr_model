[project]
name = "chapkit-ghr-model"
version = "0.1.0"
description = "ML service wrapping BSC's GHRmodel (dhis2-workflow) for CHAP"
requires-python = ">=3.13"
dependencies = [
    "chapkit>=1.0.0",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "uvicorn[standard]>=0.30.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
